apiVersion: v1
kind: Service
metadata:
  name: {{ include "vllm-platform.fullname" . }}-frontend
  labels:
    {{- include "vllm-platform.labels" . | nindent 4 }}
    app: frontend

spec:
  type: {{ .Values.frontend.service.type }}

  selector:
    {{- include "vllm-platform.selectorLabels" . | nindent 4 }}
    app: frontend

  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: 80
      protocol: TCP
